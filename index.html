<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Eazzy Webs | Premium Web Design & Digital Agency</title>
    <meta name="description" content="We create premium websites that are fast, beautiful, mobile-friendly, and designed to convert visitors into customers. Get a free quote today!" />
    <meta name="keywords" content="web design, web development, premium websites, landing pages, business websites, eazzy webs, custom web design" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eazzywebs.com" />
    <meta property="og:title" content="Eazzy Webs | Premium Web Design & Digital Agency" />
    <meta property="og:description" content="We create premium websites that are fast, beautiful, mobile-friendly, and designed to convert visitors into customers." />
    <meta property="og:image" content="https://eazzywebs.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://eazzywebs.com" />
    <meta property="twitter:title" content="Eazzy Webs | Premium Web Design & Digital Agency" />
    <meta property="twitter:description" content="We create premium websites that are fast, beautiful, mobile-friendly, and designed to convert visitors into customers." />
    <meta property="twitter:image" content="https://eazzywebs.com/og-image.png" />

    <!-- Google Fonts: Poppins for headings, Inter for paragraphs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Eazzy Webs",
        "image": "https://eazzywebs.com/logo.png",
        "description": "Premium web design agency specializing in fast, high-converting, and beautiful websites.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Colesberg",
          "addressRegion": "Northern Cape",
          "addressCountry": "ZA"
        },
        "priceRange": "$$",
        "telephone": "+27622995259",
        "url": "https://eazzywebs.com"
      }
    </script>
  </head>
  <body class="bg-[#0B1120] text-white overflow-x-hidden antialiased">
    <div id="root"></div>

    <!-- Hidden form for Netlify robot/crawler to detect at build-time -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="businessName" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
